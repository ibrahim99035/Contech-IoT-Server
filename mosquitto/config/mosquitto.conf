# Mosquitto MQTT Broker Configuration
# File: ./mosquitto/config/mosquitto.conf

# Basic Settings
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Network Settings
bind_address 0.0.0.0

# Plain MQTT (port 1884) and WebSockets (port 9002) are used ONLY inside the
# Compose network (the API connects to mqtt-broker:1884; nginx proxies the
# WebSocket via mqtt-broker:9002). They are bound to loopback on the host and
# are NOT reachable from the internet.
listener 1884
protocol mqtt

listener 9002
protocol websockets

# MQTT over TLS (port 8883) - the only port external devices may use.
# Certificate/key are the Let's Encrypt cert for mqtt.contech-iot.com, synced
# into ./mosquitto/certs by scripts/sync-mqtt-certs.sh on every deploy/renewal.
listener 8883
protocol mqtt
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

# Security Settings - Enable Authentication
allow_anonymous false
password_file /mosquitto/config/passwd

# Optional: Access Control List (ACL) for topic permissions
# acl_file /mosquitto/config/acl

# Connection Settings
max_connections 1000
max_inflight_messages 20
max_queued_messages 100

# Message Size Limits
message_size_limit 10485760

# Client Settings
persistent_client_expiration 1h

# Logging
connection_messages true
log_timestamp true