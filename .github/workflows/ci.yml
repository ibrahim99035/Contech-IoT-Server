name: CI

on:
  pull_request:
    branches: [ main, updates ]
  push:
    branches: [ main, updates ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/contech_test_db
      JWT_SECRET: dummy-ci-only-jwt-secret
      PORT: '5001'
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub service containers cannot override the image command, so a
      # service would run a standalone mongod. The app opens multi-document
      # transactions, which a standalone server rejects with "Transaction
      # numbers are only allowed on a replica set member or mongos". Start
      # mongod ourselves with --replSet and form a single-node set that
      # advertises 127.0.0.1:27017, matching how the suite runs locally.
      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongo-rs -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all

          for i in $(seq 1 30); do
            docker exec mongo-rs mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 2
          done

          docker exec mongo-rs mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"

          for i in $(seq 1 30); do
            ready=$(docker exec mongo-rs mongosh --quiet --eval "db.runCommand({hello:1}).isWritablePrimary" 2>/dev/null)
            [ "$ready" = "true" ] && exit 0
            sleep 2
          done

          echo "MongoDB did not become writable primary in time" >&2
          docker logs mongo-rs
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run integration test suite
        run: npm test
  # This repository is public. Credentials committed here are readable by
  # anyone, so a leak must fail the build rather than reach main.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject committed credentials
        run: node scripts/scan-secrets.js
