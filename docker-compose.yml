# Shared Docker log rotation. The json-file driver is unbounded by default and
# a single runaway container previously produced a 1.7 GB log on this host.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: contech-mongodb
    restart: unless-stopped
    # Caps memory so a runaway container cannot OOM the co-tenant rihla stack
    # (and vice versa) on this shared 3.8 GiB host.
    mem_limit: 768m
    # Loopback only: the database is reachable over the Compose network, and
    # publishing it on 0.0.0.0 exposed an authenticated-only service to the
    # internet (Docker's port publishing bypasses UFW).
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: contech
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
      - ./mongodb/backups:/backups
      - ./mongodb/keyfile:/data/keyfile:ro
    networks:
      - contech-network
    command: --auth --bind_ip_all --replSet rs0 --keyFile /data/keyfile
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # MongoDB Express (Web UI for database management)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: contech-mongo-express
    restart: unless-stopped
    mem_limit: 128m
    # Loopback only: an unauthenticated-by-default DB admin UI must never be
    # published on the public interface.
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-contech_admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    networks:
      - contech-network
    depends_on:
      - mongodb
    logging: *default-logging

  # Node.js Application
  api:
    image: ${CONTECH_IMAGE:-ghcr.io/ibrahim99035/contech-iot-server:latest}
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: contech-api
    restart: unless-stopped
    mem_limit: 512m
    # Loopback only: nginx reaches the API over the Compose network, so the API
    # must not be published on the public interface (Docker's port publishing
    # bypasses UFW and exposed the whole API + AdminJS over plain HTTP).
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - contech-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # Mosquitto MQTT Broker
  mqtt-broker:
    image: eclipse-mosquitto:2.0.18
    container_name: contech-mqtt
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "1884:1884"
      - "9002:9002"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/logs:/mosquitto/log
    networks:
      - contech-network
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    logging: *default-logging

  # Redis Cache (task scheduler queue + caching)
  redis:
    image: redis:7-alpine
    container_name: contech-redis
    restart: unless-stopped
    mem_limit: 256m
    # BullMQ requires noeviction: with allkeys-lru, queue/job keys can be evicted
    # under memory pressure, silently dropping scheduled device tasks.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    # Loopback only: Redis is used in-network; the 0.0.0.0 publish exposed it.
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - contech-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: contech-nginx
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    networks:
      - contech-network
    depends_on:
      - api
      - mqtt-broker
    logging: *default-logging

networks:
  contech-network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  mosquitto-data:
  mosquitto-logs:
  redis-data:
